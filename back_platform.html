<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeCode OJ · 管理后台</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
    <div id="app" class="app-admin">
        <nav class="navbar">
            <div class="logo">
                <span class="logo-icon" id="logoIcon"></span>
                <span class="logo-text">WeCode OJ · 管理后台</span>
            </div>
            <div class="nav-actions" id="navActions"></div>
        </nav>

        <div class="admin-layout">
            <aside class="admin-sidebar">
                <div class="menu-item active" data-panel="users">
                    <img src="assets/icons/icon-user.svg" alt="" class="menu-icon" />
                    用户管理
                </div>
                <div class="menu-item" data-panel="problems">
                    <img src="assets/icons/icon-problems.svg" alt="" class="menu-icon" />
                    题目管理
                </div>
                <div class="menu-item" data-panel="tags">
                    <img src="assets/icons/icon-tag.svg" alt="" class="menu-icon" />
                    标签管理
                </div>
            </aside>

            <main class="admin-content" id="adminContent">
                <div id="adminPanel"></div>
            </main>
        </div>

        <div id="toastContainer" class="toast-container"></div>
        <div id="modalRoot"></div>
    </div>

    <script type="module" src="js/admin-main.js"></script>
</body>
</html>
